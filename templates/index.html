<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI SMS Spam Detector</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            text-align: center;
            padding: 50px 20px;
        }

        .container {
            background: white;
            max-width: 550px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        textarea {
            width: 95%;
            height: 120px;
            padding: 10px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            background: #4f46e5;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #3730a3;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
        }

        .spam {
            background: #fee2e2;
            color: #b91c1c;
        }

        .ham {
            background: #dcfce7;
            color: #166534;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📩 AI SMS Spam Detector</h1>

        <p>Enter an SMS message to check whether it is spam or genuine.</p>

        <form method="POST">
            <textarea
                name="message"
                placeholder="Type your SMS message here..."
                required>{{ message }}</textarea>

            <br>
            <button type="submit">Check Message</button>
        </form>

        {% if prediction == "spam" %}
            <div class="result spam">
                ⚠️ This message may be SPAM!
            </div>
        {% elif prediction == "ham" %}
            <div class="result ham">
                ✅ This message was classified as HAM (Genuine).
            </div>
        {% endif %}
    </div>
</body>
</html>
